[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@supabase/supabase-js", "@sparticuz/chromium", "puppeteer-core"]

[functions."stripe-reconcile"]
  schedule = "0 2 * * *"

[functions."vocab-bg-sweep"]
  schedule = "*/30 * * * *"

[functions."vocab-bg-generate-background"]
  included_files = ["library/reusable-seed/**", "library/vocab/**", "library/blueprints/**", "js/engine/**", "js/data/**", "js/library/**", "scripts/lib/**", "scripts/audit-pass-2.mjs", "scripts/blacklist.mjs", "scripts/generate-lesen-part-gemini.mjs", "scripts/generate-part-gemini.mjs", "data/coverage/**", "data/lexicon/**", "knowledge/**", "plantillas-horen-b1/**", "plantillas-lesen-b1/**"]

[functions."vocab-bg-trigger"]
  included_files = ["js/library/personalPoolQuota.js"]

[functions."claude-chat"]
  timeout = 60  # client ChunkRunner uses 55s; see docs/personal-exam-generation.md
  included_files = ["js/engine/**", "js/data/**", "js/library/**", "library/blueprints/**", "library/vocab/**", "knowledge/**", "scripts/lib/**", "scripts/audit-pass-2.mjs", "scripts/blacklist.mjs", "data/lexicon/**"]

[functions."exam-pool"]
  included_files = ["library/blueprints/**", "library/banks/**", "library/curated/**", "library/pool-seed/**", "library/schemas/**", "library/catalogThresholds.json", "js/engine/**", "knowledge/**"]

[functions."admin-api"]
  # Runtime FS deps: resolveFromRoot (js/*, library/*) + dynamic import scripts/lib/*.mjs
  # (pool_gap_probe → poolGapPlanner/lesenTemplatePrompt/lexicalCheck → blacklist.mjs; personal_plan_probe; qualityGateRunner)
  included_files = ["library/blueprints/**", "library/banks/**", "library/curated/**", "library/schemas/**", "library/reusable-seed/**", "library/vocab/**", "js/engine/**", "js/data/**", "js/library/**", "data/lexicon/**", "data/excluded-premises.json", "data/lesen-t2-openings-bank.json", "data/lesen-t3-names-bank.json", "knowledge/**", "scripts/lib/**", "scripts/blacklist.mjs", "scripts/audit-pass-2.mjs", "plantillas-lesen-b1/**", "plantillas-horen-b1/**"]

[functions."tts"]
  included_files = ["library/tts-cache/**"]

[build]
  command = "npm run build:site"
  publish = "dist"
  environment = { NODE_VERSION = "20" }

[functions."exam-part"]
  # planModule + Lesen text verify can exceed platform default (~10–30s); Hören often ~12–15s
  timeout = 60
  # Same runtime FS bundle as admin-api plan/pick paths (+ POST quality gate via js/engine; local seed)
  included_files = ["library/vocab/**", "library/blueprints/**", "library/reusable-seed/**", "library/official-index/**", "data/exams/availability.json", "js/engine/**", "js/data/**", "js/library/**", "data/lexicon/**", "data/excluded-premises.json", "data/lesen-t2-openings-bank.json", "data/lesen-t3-names-bank.json", "knowledge/**", "scripts/lib/**", "scripts/blacklist.mjs", "scripts/audit-pass-2.mjs", "plantillas-lesen-b1/**", "plantillas-horen-b1/**"]

[functions."exam-plan"]
  # hybrid decision: external hybridExamPlan.mjs + pool index CJS bridge
  included_files = ["library/vocab/**", "library/blueprints/**", "scripts/lib/**", "scripts/generate-lesen-part-gemini.mjs", "scripts/make-t3.mjs", "scripts/t3-blueprints/**", "scripts/audit-pass-2.mjs", "scripts/blacklist.mjs", "plantillas-lesen-b1/**", "js/engine/**", "js/data/**", "js/library/**", "knowledge/**", "data/lexicon/**", "netlify/functions/lib/partIndex.js", "netlify/functions/lib/projectRoot.js", "netlify/functions/lib/passageVocab.js", "netlify/functions/lib/poolSearchCache.js", "netlify/functions/lib/poolSourceMode.js"]

[functions."exam-hybrid-execute"]
  timeout = 60  # prod sync cap ~60s; client uses 55s per teil call
  # hybrid execution: exam-plan deps + Gemini factory + delivery gate + t3 blueprints
  included_files = ["library/vocab/**", "library/blueprints/**", "scripts/lib/**", "scripts/generate-lesen-part-gemini.mjs", "scripts/make-t3.mjs", "scripts/t3-blueprints/**", "scripts/audit-pass-2.mjs", "scripts/blacklist.mjs", "plantillas-lesen-b1/**", "js/engine/**", "js/data/**", "js/library/**", "knowledge/**", "data/lexicon/**", "netlify/functions/lib/partIndex.js", "netlify/functions/lib/projectRoot.js", "netlify/functions/lib/passageVocab.js", "netlify/functions/lib/poolSearchCache.js", "netlify/functions/lib/poolSourceMode.js"]

[functions."vocab-cache"]
  timeout = 26

[functions."generate-pdf"]
  timeout = 26
  included_files = ["assets/css/app.css", "js/i18n/consentLocale.js", "js/i18n/pdfReportLocale.js", "js/bootstrap/featurePdf.js", "netlify/functions/lib/pdfRender.js"]

[dev]
  publish = "."
  framework = "#static"
  functions = "netlify/functions"
  # netlify dev defaults to 30s function timeout unless the linked site has functions_timeout ≥60.
  # Hybrid Gemini factory needs much longer — use: npm run dev:hybrid (patches CLI to 300s locally).
  # Link the production site (`netlify link`) so claude-chat matches production timeout when possible.
  # Do NOT use [dev.functions."name"] here — it makes dev.functions an object and crashes netlify dev.

# Primary domain in Netlify UI is lexicoil.com (apex). Do NOT add JS redirects to www.

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/demo"
  to = "/demo.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Content corrections API (admin JWT) — avoid clash with /admin → admin.html
[[redirects]]
  from = "/api/admin/content-corrections"
  to = "/.netlify/functions/content-corrections"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/content-corrections/*"
  to = "/.netlify/functions/content-corrections/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/dashboard"
  to = "/app.html?auth=login"
  status = 302

[[redirects]]
  from = "/workspace"
  to = "/app.html?auth=login"
  status = 302

[[redirects]]
  from = "/workspace/*"
  to = "/app.html?auth=login"
  status = 302

[[redirects]]
  from = "/learning"
  to = "/app.html?auth=login"
  status = 302

[[redirects]]
  from = "/confirmacion"
  to = "/confirmacion.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "microphone=(self), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://esm.sh https://js.stripe.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com; connect-src 'self' https://api.anthropic.com https://api.stripe.com https://*.supabase.co https://esm.sh https://www.google-analytics.com https://analytics.google.com https://*.google-analytics.com https://www.googletagmanager.com https://generativelanguage.googleapis.com wss://generativelanguage.googleapis.com; frame-src https://checkout.stripe.com https://js.stripe.com"
